<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentations</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header>
  <h1>- PRESENTATIONS -</h1>
</header>
  <br>
  <br>

<main id="grid"></main>
<p id="empty" hidden>No presentations yet. Add files to <code>presentations/</code> and list them in <code>presentations/db.js</code>.</p>

<div id="player" tabindex="-1" hidden>
  <canvas id="pcanvas" hidden></canvas>
  <iframe id="pframe" title="Presentation" allow="autoplay; fullscreen" tabindex="-1" hidden></iframe>
  <div id="shield"></div>
  <div id="count"></div>
  <div id="bar"></div>
</div>

<script src="presentations/db.js"></script>
<script src="app.js"></script>
</body>
</html>

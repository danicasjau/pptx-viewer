<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Roadmap</title>
<style>
html,body{height:100%;margin:0;background:#0d1b2a;color:#f2f2f2;font:4vmin/1.3 system-ui,sans-serif;overflow:hidden}
section{position:absolute;inset:0;display:none;place-content:center;padding:9vmin}
section.on{display:grid}
h1{font-size:9vmin;margin:0 0 2vmin;font-weight:600}p{color:#8fb3d9;margin:0}
</style></head><body>
<section><h1>Roadmap 2027</h1><p>Where we are going next year.</p></section>
<section><h1>Q1</h1><p>Ship the new editor.</p></section>
<section><h1>Q2</h1><p>Open the plugin API.</p></section>
<section><h1>Q3</h1><p>Mobile apps.</p></section>
<section><h1>Q4</h1><p>Team workspaces.</p></section>
<script>
const s=[...document.querySelectorAll('section')];let i=0;
function show(n){i=Math.max(0,Math.min(s.length-1,n));s.forEach((e,k)=>e.classList.toggle('on',k===i));
 parent.postMessage({type:'slide',index:i,total:s.length},'*');}
function nav(d){show(i+d);}
addEventListener('keydown',e=>{
 if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key))nav(1);
 if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))nav(-1);
 if(e.key==='Home')show(0);if(e.key==='End')show(s.length-1);});
addEventListener('message',e=>{if(e.data&&e.data.type==='nav')nav(e.data.dir);});
show(0);
</script></body></html>
